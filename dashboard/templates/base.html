<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Sales Outreach System{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body { background: #f8f9fa; }
  .sidebar { min-height: 100vh; background: #1a1a2e; color: #eee; width: 220px; position: fixed; top: 0; left: 0; padding-top: 20px; z-index: 100; }
  .sidebar a { color: #ccc; text-decoration: none; display: block; padding: 10px 20px; border-radius: 4px; margin: 2px 8px; }
  .sidebar a:hover, .sidebar a.active { background: #16213e; color: #fff; }
  .sidebar .brand { font-size: 15px; font-weight: bold; padding: 0 20px 20px; color: #fff; border-bottom: 1px solid #333; margin-bottom: 10px; }
  .main { margin-left: 220px; padding: 24px; }
  .stat-card { border-radius: 12px; padding: 20px 24px; color: white; }
  .stat-card.blue  { background: linear-gradient(135deg, #1a73e8, #0d47a1); }
  .stat-card.red   { background: linear-gradient(135deg, #e53935, #b71c1c); }
  .stat-card.green { background: linear-gradient(135deg, #43a047, #1b5e20); }
  .stat-card.orange{ background: linear-gradient(135deg, #fb8c00, #e65100); }
  .score-badge { font-size: 12px; padding: 2px 8px; border-radius: 12px; }
  .score-high { background: #e8f5e9; color: #2e7d32; }
  .score-mid  { background: #fff8e1; color: #f57f17; }
  .score-low  { background: #fce4ec; color: #c62828; }
  .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 12px; }
  .hot-indicator { width: 10px; height: 10px; border-radius: 50%; background: #f44336; display: inline-block; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
</style>
</head>
<body>
<div class="sidebar">
  <div class="brand"><i class="bi bi-graph-up-arrow"></i> Sales System</div>
  <a href="/" class="{% if request.url.path == '/' %}active{% endif %}"><i class="bi bi-speedometer2"></i> ダッシュボード</a>
  <a href="/leads" class="{% if '/leads' in request.url.path %}active{% endif %}"><i class="bi bi-people"></i> リード管理</a>
  <a href="/hot-leads" class="{% if '/hot-leads' in request.url.path %}active{% endif %}"><i class="bi bi-fire"></i> ホットリード <span class="hot-indicator ms-1"></span></a>
  <a href="/outreach" class="{% if '/outreach' in request.url.path %}active{% endif %}"><i class="bi bi-envelope-paper"></i> メール送信</a>
</div>
<div class="main">
{% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
