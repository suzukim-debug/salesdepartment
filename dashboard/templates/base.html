<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Sales Outreach System{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body { background: #f0f2f5; }
  .sidebar { min-height: 100vh; background: #0f172a; color: #e2e8f0; width: 230px; position: fixed; top: 0; left: 0; padding-top: 20px; z-index: 100; overflow-y: auto; }
  .sidebar .brand { font-size: 14px; font-weight: 700; padding: 0 20px 20px; color: #fff; border-bottom: 1px solid #1e293b; margin-bottom: 8px; letter-spacing: .5px; }
  .sidebar .section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #64748b; padding: 12px 20px 4px; }
  .sidebar a { color: #94a3b8; text-decoration: none; display: flex; align-items: center; gap: 9px; padding: 9px 20px; border-radius: 6px; margin: 1px 8px; font-size: 13.5px; }
  .sidebar a:hover { background: #1e293b; color: #fff; }
  .sidebar a.active { background: #1d4ed8; color: #fff; }
  .sidebar a .badge-hot { background: #ef4444; color: white; font-size: 10px; padding: 1px 5px; border-radius: 8px; }
  .main { margin-left: 230px; padding: 24px; min-height: 100vh; }
  .page-header { margin-bottom: 20px; }
  .stat-card { border-radius: 12px; padding: 18px 22px; color: white; position: relative; overflow: hidden; }
  .stat-card::after { content: ''; position: absolute; right: -20px; top: -20px; width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.1); }
  .stat-card.blue   { background: linear-gradient(135deg, #1d4ed8, #1e40af); }
  .stat-card.red    { background: linear-gradient(135deg, #dc2626, #991b1b); }
  .stat-card.green  { background: linear-gradient(135deg, #059669, #065f46); }
  .stat-card.orange { background: linear-gradient(135deg, #d97706, #92400e); }
  .stat-card.purple { background: linear-gradient(135deg, #7c3aed, #4c1d95); }
  .stat-card.teal   { background: linear-gradient(135deg, #0891b2, #164e63); }
  .stat-num { font-size: 30px; font-weight: 700; line-height: 1; }
  .stat-label { font-size: 12px; opacity: .85; margin-top: 4px; }
  .score-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .score-high { background: #dcfce7; color: #166534; }
  .score-mid  { background: #fef9c3; color: #854d0e; }
  .score-low  { background: #fee2e2; color: #991b1b; }
  .hot-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; display: inline-block; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }
  .step-badge { font-size: 10px; background: #dbeafe; color: #1e40af; padding: 1px 6px; border-radius: 8px; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="brand"><i class="bi bi-graph-up-arrow me-2" style="color:#60a5fa"></i>Sales Outreach</div>

  <div class="section-label">概要</div>
  <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">
    <i class="bi bi-speedometer2"></i> ダッシュボード
  </a>

  <div class="section-label">リスト収集・分析</div>
  <a href="/scraper" class="{% if '/scraper' in request.url.path %}active{% endif %}">
    <i class="bi bi-search"></i> <span>①スクレイピング</span>
  </a>
  <a href="/leads" class="{% if request.url.path == '/leads' %}active{% endif %}">
    <i class="bi bi-people"></i> <span>②リード管理・スコア</span>
  </a>

  <div class="section-label">アウトリーチ</div>
  <a href="/outreach" class="{% if '/outreach' in request.url.path %}active{% endif %}">
    <i class="bi bi-robot"></i> <span>③④メール生成・送信</span>
  </a>
  <a href="/hot-leads" class="{% if request.url.path == '/hot-leads' %}active{% endif %}">
    <i class="bi bi-fire"></i>
    <span>⑤⑥反響・テレアポリスト</span>
    <span class="hot-dot ms-auto"></span>
  </a>

  <div class="section-label">テレアポ</div>
  <a href="/calls" class="{% if request.url.path == '/calls' %}active{% endif %}">
    <i class="bi bi-telephone"></i> <span>⑦架電管理</span>
  </a>

  <div class="section-label">分析・記録</div>
  <a href="/analytics" class="{% if '/analytics' in request.url.path %}active{% endif %}">
    <i class="bi bi-bar-chart-line"></i> <span>⑧結果・分析</span>
  </a>
</div>

<div class="main">
{% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
