<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ・説明会申し込み</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f5f5f5;">
<div class="container py-5" style="max-width:560px;">
  <div class="card border-0 shadow">
    <div class="card-header bg-primary text-white py-3">
      <h5 class="mb-0">15分オンライン説明会 お申し込み</h5>
      <small style="opacity:.8;">お気軽にお申し込みください。ご都合に合わせてご案内します。</small>
    </div>
    <div class="card-body p-4">
      <form method="post" action="/form/{{ token }}/submit">
        <div class="mb-3">
          <label class="form-label">お名前 <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" required placeholder="山田 太郎">
        </div>
        <div class="mb-3">
          <label class="form-label">会社名 <span class="text-danger">*</span></label>
          <input type="text" name="company" class="form-control" required placeholder="株式会社〇〇">
        </div>
        <div class="mb-3">
          <label class="form-label">メールアドレス <span class="text-danger">*</span></label>
          <input type="email" name="email" class="form-control" required placeholder="example@company.com">
        </div>
        <div class="mb-3">
          <label class="form-label">お電話番号</label>
          <input type="tel" name="phone" class="form-control" placeholder="03-XXXX-XXXX">
        </div>
        <div class="mb-3">
          <label class="form-label">ご質問・ご要望</label>
          <textarea name="message" class="form-control" rows="3" placeholder="現在のSNS運用状況や、お悩みなどお気軽にどうぞ"></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100">申し込む</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
